<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {background-color: #f0f0f2; margin: 50px;}
        h1 {color: #FF5A43;}
        card-label {font-size: 11px; color: #999; text-transform: uppercase;}
        pre {font-size: 14px; color: #333;}
    </style>
    <title>Document</title>
</head>
<body class="py-4">

    <div id="container">
        <h1 class="mb-1">My Phone Contact</h1>
        <p class="text-muted mb-4">Introduction to Objects in Javascript - Grade 4 to 6</p>

        <div class="card shadow-sm-4 mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style="color: #FF5A43;">Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Phone</span>
                        <strong id="phone">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">School</span>
                        <strong id="school">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">City</span>
                        <strong id="city">-</strong>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card shadow-sm-4" style="max-width: 400px;">
            <div class="card-body">
                <h6 style="color: #FF5A43;">Javascript Object Used</h6>
                <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0">
                </pre>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
